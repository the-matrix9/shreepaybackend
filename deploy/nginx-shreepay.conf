# /etc/nginx/sites-available/shreepay   (replace example.com with your domain)
# One backend, two hostnames: api.example.com (dashboard + merchant API) and pay.example.com (customer payment pages).

upstream shreepay_api { server 127.0.0.1:4000; keepalive 32; }

limit_req_zone $binary_remote_addr zone=sp_per_ip:10m rate=30r/s;

server {
  listen 80;
  server_name api.example.com pay.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.example.com pay.example.com;

  ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

  client_max_body_size 50k;
  server_tokens off;

  location / {
    limit_req zone=sp_per_ip burst=60 nodelay;
    proxy_pass http://shreepay_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;                       # backend decides api vs pay by Host
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }
}
